name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      widget_diagnostics:
        description: Build extra static/read-only diagnostic widgets (artifact only)
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    paths:
      - "ParcelKeeper/**"
      - "ParcelKeeperWidget/**"
      - "ParcelKeeperTests/**"
      - "scripts/verify_ipa.py"
      - "project.yml"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DIAGNOSTIC_CONDITION: ${{ inputs.widget_diagnostics && 'WIDGET_DIAGNOSTICS' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select and show Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Test on available iPhone simulator
        run: |
          set -o pipefail
          mkdir -p build
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          xcodebuild -project ParcelKeeper.xcodeproj -scheme ParcelKeeper -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath build/TestResults.xcresult "SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG $DIAGNOSTIC_CONDITION" test | tee test.log

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project ParcelKeeper.xcodeproj \
            -scheme ParcelKeeper \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "SWIFT_ACTIVE_COMPILATION_CONDITIONS=$DIAGNOSTIC_CONDITION" \
            clean build | tee build.log

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry ParcelKeeper-unsigned.ipa Payload

      - name: Verify packaged icon and widget metadata
        run: python3 scripts/verify_ipa.py build/ParcelKeeper-unsigned.ipa

      - name: Upload IPA and build log
        uses: actions/upload-artifact@v4
        with:
          name: ParcelKeeper-unsigned
          path: |
            build/ParcelKeeper-unsigned.ipa
            build.log
          if-no-files-found: error

      - name: Publish verified unsigned IPA
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !inputs.widget_diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Payload/ParcelKeeper.app/Info.plist)
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          (cd build && shasum -a 256 ParcelKeeper-unsigned.ipa > SHA256SUMS.txt)
          NOTES="自动构建预发布版；来源提交 ${GITHUB_SHA}。测试、Release 编译及 IPA 图标/组件配置校验均成功。无签名 IPA，最低 iOS 17，需自行签名；主 App 和组件必须获得相同 App Group 授权。编译通过不等于真机/重签/CPA 验收通过。安装前请备份数据。构建：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh release create "$TAG" build/ParcelKeeper-unsigned.ipa build/SHA256SUMS.txt --target "$GITHUB_SHA" --title "快递管家 ${VERSION} · Build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}（无签名）" --prerelease --notes "$NOTES"
          gh release view "$TAG" --json url,targetCommitish,assets
