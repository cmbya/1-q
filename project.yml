name: ParcelKeeper
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
targets:
  ParcelKeeper:
    type: application
    platform: iOS
    sources:
      - path: ParcelKeeper
        excludes:
          - Resources
          - ParcelKeeper.entitlements
    resources:
      - path: ParcelKeeper/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinghao.ParcelKeeper
        PRODUCT_MODULE_NAME: ParcelKeeper
        PRODUCT_NAME: 快递管家
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 快递管家
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_ParcelKeeperAppGroup: group.com.dinghao.ParcelKeeper
        CODE_SIGN_ENTITLEMENTS: ParcelKeeper/ParcelKeeper.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  ParcelKeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParcelKeeperTests
    dependencies:
      - target: ParcelKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinghao.ParcelKeeperTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ParcelKeeper:
    build:
      targets:
        ParcelKeeper: all
    test:
      targets:
        - ParcelKeeperTests
    run:
      config: Debug
    archive:
      config: Release
