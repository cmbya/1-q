name: ParcelKeeper
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
targets:
  ParcelKeeper:
    type: application
    platform: iOS
    sources:
      - path: ParcelKeeper
        excludes:
          - ParcelKeeper.entitlements
    info:
      path: ParcelKeeper/Info.plist
      properties:
        CFBundleDisplayName: 快递管家
        ParcelKeeperAppGroup: group.com.dinghao.ParcelKeeper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.dinghao.ParcelKeeper.train
            CFBundleURLSchemes:
              - parcelkeeper
    dependencies:
      - target: ParcelKeeperWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinghao.ParcelKeeper
        PRODUCT_MODULE_NAME: ParcelKeeper
        PRODUCT_NAME: ParcelKeeper
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: 快递管家
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 4
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_ParcelKeeperAppGroup: group.com.dinghao.ParcelKeeper
        CODE_SIGN_ENTITLEMENTS: ParcelKeeper/ParcelKeeper.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
  ParcelKeeperWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ParcelKeeperWidget
        excludes:
          - ParcelKeeperWidget.entitlements
          - Info.plist
          - README.md
      - path: ParcelKeeper/Services/AppGroupResolver.swift
      - path: ParcelKeeper/Models/WidgetSlotBinding.swift
      - path: ParcelKeeper/Models/PickupData.swift
      - path: ParcelKeeper/Models/TrainTicket.swift
      - path: ParcelKeeper/Models/Shipment.swift
      - path: ParcelKeeper/Services/SharedPickupStore.swift
      - path: ParcelKeeper/Services/CarrierDetector.swift
    info:
      path: ParcelKeeperWidget/Info.plist
      properties:
        CFBundleDisplayName: 待取件码
        ParcelKeeperAppGroup: group.com.dinghao.ParcelKeeper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinghao.ParcelKeeper.Widget
        PRODUCT_NAME: ParcelKeeperWidget
        CODE_SIGN_ENTITLEMENTS: ParcelKeeperWidget/ParcelKeeperWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 4
        TARGETED_DEVICE_FAMILY: "1"
  ParcelKeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParcelKeeperTests
    dependencies:
      - target: ParcelKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinghao.ParcelKeeperTests
        GENERATE_INFOPLIST_FILE: YES
  ParcelKeeperWidgetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParcelKeeperWidgetUITests
    dependencies:
      - target: ParcelKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinghao.ParcelKeeper.WidgetUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ParcelKeeper
schemes:
  WidgetProbe:
    build:
      targets:
        ParcelKeeper: all
        ParcelKeeperWidgetUITests: [test]
    test:
      targets:
        - ParcelKeeperWidgetUITests
  ParcelKeeper:
    build:
      targets:
        ParcelKeeper: all
    test:
      targets:
        - ParcelKeeperTests
    run:
      config: Debug
    archive:
      config: Release
